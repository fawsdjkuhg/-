<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>...</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #fff;
    font-family: monospace;
}

body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.035) 0px,
        rgba(255,255,255,0.035) 1px,
        transparent 1px,
        transparent 4px
    );
}

.eye {
    position: fixed;
    width: 520px;
    height: 280px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border: 3px solid rgba(255,255,255,0.07);
    border-radius: 50%;
}

.eye::before {
    content: "";
    position: absolute;
    width: 150px;
    height: 150px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border: 3px solid rgba(255,255,255,0.07);
    border-radius: 50%;
}

.eye::after {
    content: "";
    position: absolute;
    width: 35px;
    height: 35px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    background: rgba(255,255,255,0.07);
    border-radius: 50%;
}

#timer {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    font-size: clamp(35px, 7vw, 90px);
    white-space: nowrap;
    text-shadow: 0 0 10px white, 0 0 30px rgba(255,255,255,0.5);
    z-index: 2;
}

#redButton {
    position: fixed;
    right: 25px;
    bottom: 25px;
    width: 55px;
    height: 55px;
    border-radius: 50%;
    border: 2px solid red;
    background: #900;
    cursor: pointer;
    box-shadow: 0 0 15px red;
    z-index: 5;
}

#redButton:hover {
    background: #d00;
}


#desktop {
    display: none;
    position: fixed;
    inset: 0;
    background: #050505;
    z-index: 10;
}

.desktop-title {
    position: absolute;
    top: 20px;
    left: 25px;
    font-size: 18px;
    opacity: 0.7;
}

.folder-area {
    position: absolute;
    top: 70px;
    left: 25px;
    display: flex;
    gap: 35px;
}

.folder {
    width: 80px;
    text-align: center;
    cursor: pointer;
    user-select: none;
}

.folder-icon {
    width: 55px;
    height: 42px;
    margin: auto;
    background: #777;
    border: 2px solid #aaa;
    position: relative;
}

.folder-icon::before {
    content: "";
    position: absolute;
    width: 25px;
    height: 8px;
    top: -10px;
    left: -2px;
    background: #777;
    border: 2px solid #aaa;
    border-bottom: none;
}

.folder:hover .folder-icon {
    background: #aaa;
}

.folder-name {
    margin-top: 8px;
    font-size: 13px;
}

#closeDesktop {
    position: absolute;
    right: 25px;
    top: 20px;
    width: 35px;
    height: 35px;
    background: transparent;
    color: white;
    border: 1px solid #777;
    cursor: pointer;
    font-family: monospace;
    font-size: 18px;
}

#closeDesktop:hover {
    background: #222;
}

#emptyMessage {
    display: none;
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border: 1px solid #555;
    padding: 20px 30px;
    background: #080808;
    color: #aaa;
}
</style>
</head>

<body>

<div class="eye"></div>

<div id="timer">00:00:00:00</div>

<button id="redButton"></button>

<div id="desktop">

    <div class="desktop-title">
        SYSTEM / DESKTOP
    </div>

    <button id="closeDesktop">×</button>

    <div class="folder-area">

        <div class="folder" data-folder="ARCHIVE">
            <div class="folder-icon"></div>
            <div class="folder-name">ARCHIVE</div>
        </div>

        <div class="folder" data-folder="DATA">
            <div class="folder-icon"></div>
            <div class="folder-name">DATA</div>
        </div>

        <div class="folder" data-folder="SYSTEM">
            <div class="folder-icon"></div>
            <div class="folder-name">SYSTEM</div>
        </div>

        <div class="folder" data-folder="UNKNOWN">
            <div class="folder-icon"></div>
            <div class="folder-name">UNKNOWN</div>
        </div>

    </div>

    <div id="emptyMessage">
        ПАПКА ПУСТА
    </div>

</div>

<script>
const timer = document.getElementById("timer");

const now = new Date();
const target = new Date(now);

let days = (6 - now.getDay() + 7) % 7;

target.setDate(now.getDate() + days);
target.setHours(15, 0, 0, 0);

function update() {
    const current = new Date();
    let difference = target - current;

    const negative = difference < 0;

    difference = Math.abs(difference);

    const days = Math.floor(difference / 86400000);
    const hours = Math.floor(difference / 3600000) % 24;
    const minutes = Math.floor(difference / 60000) % 60;
    const seconds = Math.floor(difference / 1000) % 60;

    timer.textContent =
        (negative ? "-" : "") +
        String(days).padStart(2, "0") + ":" +
        String(hours).padStart(2, "0") + ":" +
        String(minutes).padStart(2, "0") + ":" +
        String(seconds).padStart(2, "0");
}

update();
setInterval(update, 1000);



document.getElementById("redButton").addEventListener("click", function () {
    document.getElementById("desktop").style.display = "block";
});



document.getElementById("closeDesktop").addEventListener("click", function () {
    document.getElementById("desktop").style.display = "none";
});



document.querySelectorAll(".folder").forEach(function(folder) {

    folder.addEventListener("click", function() {

        const message = document.getElementById("emptyMessage");

        message.textContent =
            "ПАПКА " + folder.dataset.folder + " ПУСТА";

        message.style.display = "block";

        setTimeout(function() {
            message.style.display = "none";
        }, 1500);

    });

});
</script>
