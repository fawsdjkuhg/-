<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>...</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    color: #fff;
    overflow: hidden;
    font-family: monospace;
}

#timer {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    font-size: clamp(35px, 8vw, 80px);
    text-shadow: 0 0 20px #fff;
    z-index: 10;
    white-space: nowrap;
}

.message {
    position: fixed;
    color: rgba(255,255,255,.7);
    font-size: 14px;
    letter-spacing: 3px;
    opacity: 0;
    pointer-events: none;
    text-shadow: 0 0 8px #fff;
    transition: opacity .3s;
    z-index: 5;
}

.message.show {
    opacity: 1;
}
</style>
</head>

<body>

<div id="timer">00:00:00:00</div>

<script>

/* =========================
   ТАЙМЕР
========================= */

const nowAtStart = new Date();
const target = new Date(nowAtStart);

let daysUntilSaturday =
    (6 - nowAtStart.getDay() + 7) % 7;

/*
   Если сейчас суббота и время уже прошло 15:00,
   оставляем target сегодня — таймер станет отрицательным.
*/

target.setDate(
    nowAtStart.getDate() + daysUntilSaturday
);

target.setHours(15, 0, 0, 0);


function updateTimer() {

    const now = new Date();

    let difference =
        target.getTime() - now.getTime();

    const negative = difference < 0;

    difference = Math.abs(difference);

    const days = Math.floor(
        difference / 86400000
    );

    const hours = Math.floor(
        difference / 3600000
    ) % 24;

    const minutes = Math.floor(
        difference / 60000
    ) % 60;

    const seconds = Math.floor(
        difference / 1000
    ) % 60;

    const result =
        String(days).padStart(2, "0") + ":" +
        String(hours).padStart(2, "0") + ":" +
        String(minutes).padStart(2, "0") + ":" +
        String(seconds).padStart(2, "0");

    document.getElementById("timer").textContent =
        negative ? "-" + result : result;
}

updateTimer();

setInterval(updateTimer, 1000);


/* =========================
   ARG СООБЩЕНИЯ
========================= */

const messages = [

    "0J3QlSDQktCV0KDQrCDQotCQ0JnQnNCV0KDQow==",

    "0JLQodCBINCi0J7Qm9Cs0JrQniDQndCQ0KfQmNCd0JDQldCi0KHQrw==",

    "0JrQkNCW0JXQotCh0K8sINCS0KDQldCc0K8g0J/QoNCY0KjQm9Ce",

    "0JLQodCBINCV0KnQgSDQl9CU0JXQodCsPw==",

    "0K8g0JbQlNCjLg=="

];


/* =========================
   СОЗДАНИЕ СООБЩЕНИЯ
========================= */

function showMessage() {

    const message =
        document.createElement("div");

    message.className = "message";

    message.textContent =
        messages[
            Math.floor(
                Math.random() * messages.length
            )
        ];

    /* Случайное положение */

    message.style.left =
        (5 + Math.random() * 90) + "%";

    message.style.top =
        (5 + Math.random() * 90) + "%";

    document.body.appendChild(message);

    /* Появление */

    requestAnimationFrame(() => {
        message.classList.add("show");
    });


    /*
       Время жизни:
       от 2 до 10 секунд
    */

    const lifetime =
        2000 + Math.random() * 8000;


    setTimeout(() => {

        /* Исчезновение */

        message.classList.remove("show");


        /*
           Ждём окончания анимации,
           затем удаляем элемент
        */

        setTimeout(() => {

            message.remove();

            /*
               Сразу создаём новое сообщение,
               чтобы постоянно было 5
            */

            showMessage();

        }, 300);

    }, lifetime);
}


/* =========================
   ЗАПУСК
========================= */

/*
   Сразу создаём 5 сообщений.
*/

for (let i = 0; i < 5; i++) {

    setTimeout(() => {
        showMessage();
    }, i * 300);

}

</script>

</body>
</html>
