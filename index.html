<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>...</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #fff;
    font-family: monospace;
}

#main {
    position: fixed;
    inset: 0;
    background: #000;
    overflow: hidden;
}


#main::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;

    background:
        repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,0.035) 0px,
            rgba(255,255,255,0.035) 1px,
            transparent 1px,
            transparent 4px
        );

    z-index: 20;
}

.eye {
    position: absolute;
    width: 520px;
    height: 280px;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    border: 3px solid rgba(255,255,255,0.08);
    border-radius: 50%;

    opacity: 0.55;
}

.eye::before {
    content: "";

    position: absolute;

    width: 150px;
    height: 150px;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    border: 3px solid rgba(255,255,255,0.08);

    border-radius: 50%;
}

.eye::after {
    content: "";

    position: absolute;

    width: 35px;
    height: 35px;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    background: rgba(255,255,255,0.08);

    border-radius: 50%;
}

#timer {
    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    font-size: clamp(35px, 7vw, 90px);

    white-space: nowrap;

    text-shadow:
        0 0 10px white,
        0 0 30px rgba(255,255,255,0.5);

    z-index: 5;
}

.message {
    position: absolute;

    color: rgba(255,255,255,0.7);

    font-size: 14px;

    pointer-events: none;

    z-index: 6;

    animation: appear 0.3s ease;
}

@keyframes appear {
    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}

#redButton {
    position: fixed;

    right: 25px;
    bottom: 25px;

    width: 55px;
    height: 55px;

    background: #a00000;

    border: 2px solid #ff0000;

    border-radius: 50%;

    cursor: pointer;

    z-index: 100;

    box-shadow:
        0 0 10px #ff0000,
        inset 0 0 10px #400000;

    transition: 0.2s;
}

#redButton:hover {
    background: #d00000;

    box-shadow:
        0 0 20px red,
        0 0 40px rgba(255,0,0,0.5);
}

#redButton:active {
    transform: scale(0.9);
}

#desktop {
    position: fixed;

    inset: 0;

    display: none;

    background:
        radial-gradient(
            circle at center,
            #171717 0%,
            #050505 70%,
            #000 100%
        );

    z-index: 200;
}

#desktop.active {
    display: block;
}


.desktop-header {
    height: 45px;

    border-bottom: 1px solid #333;

    display: flex;
    align-items: center;

    padding: 0 15px;

    color: #aaa;

    font-size: 14px;
}


.icons {
    display: flex;

    gap: 35px;

    padding: 30px;
}

.icon {
    width: 100px;

    text-align: center;

    cursor: pointer;

    color: #aaa;

    user-select: none;
}

.icon:hover {
    color: white;
}

.icon-symbol {
    width: 55px;
    height: 45px;

    margin: auto auto 8px;

    background: #171717;

    border: 1px solid #666;

    position: relative;
}

.icon-symbol::before {
    content: "";

    position: absolute;

    left: 7px;
    top: 7px;

    width: 20px;
    height: 10px;

    background: #555;
}

.icon-name {
    font-size: 13px;

    word-break: break-word;
}

#fileWindow {
    position: absolute;

    width: min(700px, 90vw);
    height: min(500px, 75vh);

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    background: #080808;

    border: 1px solid #777;

    box-shadow:
        0 0 40px rgba(0,0,0,0.9);

    display: none;

    z-index: 300;
}

#fileWindow.active {
    display: block;
}

.window-header {
    height: 35px;

    border-bottom: 1px solid #555;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 10px;

    background: #151515;
}

#fileName {
    color: #aaa;
}

#closeFile {
    border: none;

    background: transparent;

    color: #aaa;

    font-family: monospace;

    cursor: pointer;

    font-size: 18px;
}

#closeFile:hover {
    color: red;
}

#fileContent {
    padding: 20px;

    white-space: pre-wrap;

    color: #ccc;

    line-height: 1.6;

    overflow: auto;

    height: calc(100% - 35px);
}

#returnButton {
    position: absolute;

    right: 20px;
    bottom: 20px;

    background: transparent;

    color: #777;

    border: 1px solid #444;

    padding: 8px 15px;

    font-family: monospace;

    cursor: pointer;
}

#returnButton:hover {
    color: white;

    border-color: white;
}
</style>
</head>

<body>

<div id="main">

    <div class="eye"></div>

    <div id="timer">
        00:00:00:00
    </div>

    <button id="redButton"></button>

</div>


<div id="desktop">

    <div class="desktop-header">
        SYSTEM / DESKTOP
    </div>

    <div class="icons">


        <div class="icon" ondblclick="openFolder('unknown')">

            <div class="icon-symbol"></div>

            <div class="icon-name">
                UNKNOWN
            </div>

        </div>



        <div class="icon" ondblclick="openFolder('archive')">

            <div class="icon-symbol"></div>

            <div class="icon-name">
                ARCHIVE
            </div>

        </div>



        <div
            class="icon"
            ondblclick="openFile('document1')"
        >

            <div class="icon-symbol"></div>

            <div class="icon-name">
                document.txt
            </div>

        </div>



        <div
            class="icon"
            ondblclick="openFile('document2')"
        >

            <div class="icon-symbol"></div>

            <div class="icon-name">
                note.txt
            </div>

        </div>



        <div
            class="icon"
            ondblclick="openFile('document3')"
        >

            <div class="icon-symbol"></div>

            <div class="icon-name">
                unknown.txt
            </div>

        </div>

    </div>


    <button id="returnButton">
        RETURN
    </button>

</div>

<div id="fileWindow">

    <div class="window-header">

        <span id="fileName">
            document.txt
        </span>

        <button id="closeFile">
            ×
        </button>

    </div>

    <div id="fileContent"></div>

</div>


<script>

let now = new Date();

let target = new Date(now);

let days =
    (6 - now.getDay() + 7) % 7;

target.setDate(
    now.getDate() + days
);

target.setHours(15, 0, 0, 0);


function updateTimer() {

    let current = new Date();

    let time = target - current;

    let negative = time < 0;

    time = Math.abs(time);

    let d =
        Math.floor(time / 86400000);

    let h =
        Math.floor(time / 3600000) % 24;

    let m =
        Math.floor(time / 60000) % 60;

    let s =
        Math.floor(time / 1000) % 60;


    let result =
        String(d).padStart(2, "0") + ":" +
        String(h).padStart(2, "0") + ":" +
        String(m).padStart(2, "0") + ":" +
        String(s).padStart(2, "0");


    document.getElementById("timer")
        .textContent =
        negative
            ? "-" + result
            : result;
}


updateTimer();

setInterval(updateTimer, 1000);


const messages = [

    "",

    "",

    "",

    "",

    "",

    "",

    "",

    "",

    "",

    ""

];


function createMessage() {

    let message =
        document.createElement("div");

    message.className = "message";

    message.textContent =
        messages[
            Math.floor(
                Math.random() * messages.length
            )
        ];


    message.style.left =
        Math.random() * 80 + 10 + "%";

    message.style.top =
        Math.random() * 75 + 10 + "%";


    document.getElementById("main")
        .appendChild(message);


    setTimeout(() => {

        message.remove();

    }, 5000);
}


/* Пять сообщений */

function messageCycle() {

    let count = 0;

    function next() {

        createMessage();

        count++;

        if (count < 5) {

            setTimeout(
                next,
                1200 + Math.random() * 5000
            );

        } else {

            setTimeout(
                messageCycle,
                5000
            );

        }
    }

    next();
}

messageCycle();

const files = {

    document1: {

        name: "document.txt",

        content:
`ПУСТО.

Пусто`

    },


    document2: {

        name: "note.txt",

        content:
`[ EMPTY ]

Скрыто от вашего взора.
    },


    document3: {

        name: "unknown.txt",

        content:
`??????????????????

ФАЙЛ ПУСТ.`

    }

};

function openFile(id) {

    let file = files[id];

    if (!file) return;


    document.getElementById("fileName")
        .textContent = file.name;


    document.getElementById("fileContent")
        .textContent = file.content;


    document.getElementById("fileWindow")
        .classList.add("active");
}


document
    .getElementById("closeFile")
    .addEventListener("click", () => {

        document
            .getElementById("fileWindow")
            .classList.remove("active");

    });

document
    .getElementById("redButton")
    .addEventListener("click", () => {

        document
            .getElementById("desktop")
            .classList.add("active");

    });

document
    .getElementById("returnButton")
    .addEventListener("click", () => {

        document
            .getElementById("desktop")
            .classList.remove("active");

    });


document.addEventListener("keydown", (event) => {

    if (event.key === "Escape") {

        document
            .getElementById("fileWindow")
            .classList.remove("active");

    }

});


function openFolder(folder) {

    alert(
        "Папка \"" +
        folder.toUpperCase() +
        "\" пока пуста."
    );

}

</script>

</body>
</html>
